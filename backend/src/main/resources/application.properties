server.port=8080

# MySQL database
# Create the database first: CREATE DATABASE quizdb;
spring.datasource.url=jdbc:mysql://localhost:3306/quizdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Admin login used to protect /api/admin/** (see SecurityConfig).
# Change these before deploying anywhere real.
admin.username=admin
admin.password=admin
